conky.config = {
    background = false, update_interval = 2, double_buffer = true,
    out_to_x = true, out_to_console = false, own_window = true,
    own_window_type = 'desktop', own_window_transparent = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    use_xft = true, font = 'JetBrains Mono:size=9', alignment = 'top_right',
    gap_x = 24, gap_y = 24, minimum_width = 215, draw_shades = false,
    default_color = 'b0c8ad', color1 = 'cbb586', color2 = '768579',
};
conky.text = [[
${color1}${nodename}${color}
${sysname} ${kernel}
${color2}${hr 1}${color}
CPU   ${cpu}%   ${cpubar 4,84}
RAM   ${mem} / ${memmax}
DISK  ${fs_used /} / ${fs_size /}
UP    ${uptime_short}

${color1}Super+P${color}   launch
${color1}Super+F1${color}  key guide
]];
