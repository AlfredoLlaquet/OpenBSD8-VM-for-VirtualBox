name: Build OpenBSD Xfce for VirtualBox

on:
  workflow_dispatch:
    inputs:
      checkpoint_run:
        description: Optional ID of a previous run containing this image's package checkpoint
        type: string
        required: false

concurrency:
  group: openbsd-image-release
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 310
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Make room for the package checkpoint, virtual disk, and ZIP on the hosted runner
        if: runner.environment == 'github-hosted'
        run: |
          for toolchain in /usr/local/lib/android/sdk /usr/share/dotnet /usr/local/.ghcup; do
            available_kib=$(df -Pk "$RUNNER_TEMP" | awk 'END {print $4}')
            if (( available_kib >= 24 * 1024 * 1024 )); then break; fi
            if [[ -d $toolchain ]]; then
              echo "Reclaiming the preinstalled $toolchain toolchain on this disposable VM"
              sudo rm -rf -- "$toolchain"
            fi
          done
          df -h "$RUNNER_TEMP"

      - name: Install the emulator and build tools
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils seabios curl openssh-client openssl signify-openbsd python3-pexpect python3-bcrypt python3-pil zip unzip
          if [[ -c /dev/kvm && ! -w /dev/kvm ]]; then
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          fi
          qemu-system-x86_64 --version
          df -h "$RUNNER_TEMP"

      - name: Restore a previous package checkpoint when requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.checkpoint_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.checkpoint_run }}
        run: |
          [[ $SOURCE_RUN =~ ^[0-9]+$ ]]
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name installed-packages --dir "$RUNNER_TEMP/obsd-checkpoint"
          cd "$RUNNER_TEMP/obsd-checkpoint"
          sha256sum --check SHA256SUMS

      - name: Install OpenBSD, boot the exported disk, test Xfce, and package the image
        id: build
        run: bash make_disk.sh "$RUNNER_TEMP/delivery" "$RUNNER_TEMP/obsd-checkpoint"

      - name: Check for a reusable installed system after a failed build
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        id: checkpoint
        run: |
          if [[ -s "$RUNNER_TEMP/obsd-checkpoint/packages.qcow2" ]]; then
            cd "$RUNNER_TEMP/obsd-checkpoint"
            sha256sum packages.qcow2 desktop-password root-password > SHA256SUMS
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the package checkpoint with public initial credentials for a retry
        if: ${{ failure() && steps.checkpoint.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: installed-packages
          path: ${{ runner.temp }}/obsd-checkpoint/
          if-no-files-found: error
          retention-days: 1
          compression-level: 3

      - name: Publish the verified disk and installation instructions
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="openbsd-8.0-xfce-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cd "$RUNNER_TEMP/delivery"
          gh release create "$tag" --draft OpenBSD-8.0-Xfce-amd64.zip OpenBSD-8.0-Xfce-amd64.zip.sha256 \
            OpenBSD8-VM-for-VirtualBox-INSTRUCTIONS.txt \
            --target "$GITHUB_SHA" --title 'OpenBSD 8.0 with Xfce for VirtualBox (amd64)' \
            --notes-file "$GITHUB_WORKSPACE/RELEASE-NOTES.md"
          gh release edit "$tag" --draft=false --latest

      - name: Deliver the disk as a workflow download if release publication failed
        if: steps.release.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: OpenBSD-8.0-Xfce-amd64
          path: |
            ${{ runner.temp }}/delivery/OpenBSD-8.0-Xfce-amd64.zip*
            ${{ runner.temp }}/delivery/OpenBSD8-VM-for-VirtualBox-INSTRUCTIONS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Retain graphical verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-verification-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/delivery/evidence/*.png
            ${{ runner.temp }}/delivery/evidence/verification.txt
            ${{ runner.temp }}/delivery/evidence/qemu.log
          if-no-files-found: ignore
          retention-days: 7
